<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">NAVED77F — AI/ML Enthusiast</title>
<desc id="desc">Animated midnight-blue developer banner with glowing code motifs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#071b34"/><stop offset="1" stop-color="#020617"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect width="1200" height="360" rx="26" fill="url(#grid)"/>
<circle cx="1020" cy="68" r="170" fill="#2563eb" opacity=".12"><animate attributeName="r" values="150;185;150" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="310" r="180" fill="#06b6d4" opacity=".08"><animate attributeName="r" values="180;145;180" dur="8s" repeatCount="indefinite"/></circle>
<path d="M35 82H285 M915 286H1165" stroke="url(#line)" stroke-width="2" opacity=".8"/>
<g fill="#67e8f9" opacity=".7">
  <circle cx="90" cy="112" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="130" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1030" cy="250" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Consolas, 'Courier New', monospace" fill="#7dd3fc" opacity=".58" font-size="17">
  <text x="58" y="145">&lt;build_future /&gt;</text>
  <text x="905" y="112">{"AI": "curiosity"}</text>
  <text x="928" y="138">while(learning):</text>
  <text x="950" y="164">keep_building()</text>
</g>
<g filter="url(#glow)">
  <text x="600" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="800" letter-spacing="3" fill="#f8fafc">NAVED<tspan fill="#38bdf8">77F</tspan></text>
  <path d="M405 176H795" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 390;390 0;0 390" dur="6s" repeatCount="indefinite"/>
  </path>
</g>
<text x="600" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4" fill="#bae6fd">AI/ML ENTHUSIAST  •  DATA SCIENCE  •  FULL-STACK LEARNER</text>
<text x="600" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94a3b8">Learn with intent. Build with consistency. Grow through projects.</text>
<g transform="translate(505 298)" font-family="Consolas, monospace" font-size="14" fill="#67e8f9">
  <rect x="0" y="0" width="190" height="30" rx="15" fill="#0f172a" stroke="#164e63"/>
  <circle cx="16" cy="15" r="4" fill="#22d3ee"/>
  <text x="29" y="20">status: learning</text>
</g>
</svg>